name: Publish Betrayals preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betrayals-pages.yml'
      - 'src/betrayals/**'
      - 'public/assets/betrayals/**'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: betrayals-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: node --test tests/betrayals-*.mjs
      - run: npx vitest run src/betrayals
      - run: npm run build
        env:
          VITE_BETRAYALS_EDITION: 'true'
          VITE_BASE_PATH: /the-big-eye-betrayals/
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.betrayals.config.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist
      - name: Wait for the Pages artifact index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${PAGES_ARTIFACT_NAME}" --jq '.total_count') \
              && [[ "$count" == "1" ]]; then
              exit 0
            fi
            sleep 3
          done
          echo "GitHub did not index the Pages artifact for this attempt." >&2
          exit 1
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
