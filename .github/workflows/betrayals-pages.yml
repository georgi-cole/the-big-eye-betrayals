name: Publish Betrayals preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/betrayals-pages.yml'
      - 'src/betrayals/**'
      - 'public/assets/betrayals/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: betrayals-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: node --test tests/betrayals-*.mjs
      - run: npx vitest run src/betrayals
      - run: npm run build
        env:
          VITE_BETRAYALS_EDITION: 'true'
          VITE_BASE_PATH: /the-big-eye-betrayals/
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.betrayals.config.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
