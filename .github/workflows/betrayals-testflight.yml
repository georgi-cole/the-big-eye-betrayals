name: Build Betrayals QA for TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: betrayals-testflight-upload
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/testflight-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:pr
      - run: node --test tests/betrayals-qa.mjs

  upload:
    name: Sign and upload internal QA
    needs: quality
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      IOS_BUILD_NUMBER: ${{ github.run_id }}.${{ github.run_attempt }}
      BETRAYALS_BUNDLE_ID: com.georgicole.thebigeye.betrayals
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Verify signing and upload configuration
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 ASC_API_ISSUER_ID ASC_API_KEY_ID ASC_API_KEY_P8_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Betrayals repository secret: $name"
              exit 1
            fi
          done
          xcodebuild -version
          xcode_help="$(xcodebuild -help 2>&1)"
          if [[ "$xcode_help" != *testFlightInternalTestingOnly* ]]; then
            echo "::error::The selected Xcode cannot export a TestFlight Internal Only build."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the approved Betrayals encryption baseline
        if: hashFiles('scripts/betrayals-testflight-readiness-policy.json') != ''
        run: node scripts/complete-testflight.mjs --betrayals --check-policy

      - name: Build and sync the isolated QA web bundle
        env:
          VITE_ADMOB_MODE: 'off'
        run: |
          npm run generate:audio
          npm run generate:after-eye
          npx vite build --mode betrayals-qa --base ./ --outDir dist
          test -n "$(find dist/assets -maxdepth 1 -name 'BetrayalsQaDialog-*.js' -print -quit)"
          node scripts/configure-admob.mjs ios
          npx cap sync ios
          node scripts/normalize-capacitor-swift-path.mjs

      - name: Install distribution signing for the Betrayals App ID
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/betrayals-testflight.keychain-db"
          password=$(openssl rand -hex 24)
          certificate="$RUNNER_TEMP/betrayals-distribution.p12"
          profile="$RUNNER_TEMP/betrayals.mobileprovision"
          profile_plist="$RUNNER_TEMP/betrayals-profile.plist"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")
          app_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")
          if [[ "$app_identifier" != "$team.$BETRAYALS_BUNDLE_ID" ]]; then
            echo "::error::The provisioning profile must target $BETRAYALS_BUNDLE_ID."
            exit 1
          fi
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -f pkcs12 -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          {
            echo "IOS_PROFILE_UUID=$profile_uuid"
            echo "IOS_TEAM_ID=$team"
          } >> "$GITHUB_ENV"

      - name: Archive, sign, and upload to TestFlight Internal Only
        env:
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          api_key="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$api_key"
          archive="$RUNNER_TEMP/BetrayalsQA.xcarchive"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          archive_plist="$archive/Products/Applications/App.app/Info.plist"
          archived_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$archive_plist")
          test "$archived_id" = "$BETRAYALS_BUNDLE_ID"
          archived_icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$archive_plist" 2>/dev/null || true)
          if [[ "$archived_icon" != 'AppIcon' ]]; then
            echo "::error::Expected the Betrayals AppIcon in the archive, found ${archived_icon:-no primary icon}."
            exit 1
          fi
          echo "Verified the Betrayals AppIcon in the archive."
          cat > "$RUNNER_TEMP/BetrayalsExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BETRAYALS_BUNDLE_ID</key>
              <string>$IOS_PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>testFlightInternalTestingOnly</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportPath "$RUNNER_TEMP/BetrayalsTestFlight" \
            -exportOptionsPlist "$RUNNER_TEMP/BetrayalsExportOptions.plist" \
            -authenticationKeyPath "$api_key" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
          printf '## TestFlight upload accepted\n\n- Build: %s\n- Source: %s\n- Apple processing and internal group assignment are still pending.\n' \
            "$IOS_BUILD_NUMBER" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify processing and add the build to Betrayals QA
        if: hashFiles('scripts/betrayals-testflight-readiness-policy.json') != ''
        timeout-minutes: 25
        env:
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: node scripts/complete-testflight.mjs --betrayals

      - name: Remove signing materials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/betrayals-testflight.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/betrayals-distribution.p12" \
            "$RUNNER_TEMP/betrayals.mobileprovision" "$RUNNER_TEMP/betrayals-profile.plist"
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
